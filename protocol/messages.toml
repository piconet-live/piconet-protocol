# The lobby link (formats.md section 10): the JSON messages of the WebSocket between a launcher (or the native program)
# and the coordinator, and the two documents read with the same options (the LAN announcement, the server's public
# status, GET /api/status), once. Online.Protocol's records (net/src/Online.Protocol: Messages.cs, CustomLobbies.cs,
# LiveRace.cs, PlayersList.cs, Pings.cs, ...) are what System.Text.Json writes and reads, with ControlProtocol.Json
# (the web defaults: camelCase names, read without regard to case, numbers read from strings too; a null member left
# out); their summaries say what each member means. `messages.py` loads this file and checks it; `messages_cxx.py`
# writes `generated/lobby_messages.g.h` (the C++ codec, on `cxx/json_wire.h`), `messages_cs.py`
# `generated/LobbySchema.g.cs` (these lines, which `tests/dotnet-messages` holds the records to by reflection: a
# member added, moved, renamed or retyped in C# and not here, or here and not in C#, fails protocol/check.sh).
#
# [[enum]]: name; as "name" (a string converter: the value's name, read without regard to case, or a number) or
#   "number"; underlying "byte" or "int" (left out: int), the C# enum's type (a number outside it is no value); values
#   in order from 0.
# [[record]]: name; root: "client" or "server" (a message of that side, with its `type`, the message's name on the
#   wire, written first) or "lan" / "status" (a document of its own); members in the order they are written:
#   name   the JSON name (the C# property's, camelCase);
#   type   string, int (32 bits), uint, long, byte, bool, float, double, time (a DateTimeOffset: "2026-11-14T10:00:00+00:00"),
#          list<T>, map<T> (an object of string keys, in order), a record's or an enum's name; a "?" after it: may be
#          null (left out when null). A member that is no "?" and no value (a text, a list, a record) is null when
#          the JSON leaves it out or says null, as the C# record's: the C++ struct keeps it as `wire_absent`;
#   default  the constructor parameter's default as JSON text: what a reader takes when the JSON leaves it out;
#   omit   "default": also left out when it is its type's default (false, 0);
#   written  a member the C# record writes but does not read (a property of its own, no parameter): the C++
#          expression over the struct `v` that writes it.

# ControlProtocol's numbers: the version a hello names (Hello.Version, the server refuses another), the WebSocket's path,
# how often each side pings (well inside a proxy's idle limit), the chat's two channels.
[link]
version = 3
path = "/ws"
keep_alive_seconds = 20
global_channel = "global"
lobby_channel = "lobby"

[[enum]]
name = "CpuFillMode"
as = "name"
values = ["Vote", "Always", "Never"]

[[enum]]
name = "CourseSelectMode"
as = "name"
values = ["Vote", "Random", "Fixed"]

[[enum]]
name = "ModeParamKind"
as = "number"
underlying = "byte"
values = ["Number", "Delay", "Switch", "Choice"]

[[enum]]
name = "ModeType"
as = "number"
values = ["Int", "Real", "Bool", "Seat", "Seats", "Vec"]

[[record]]
name = "Hello"
root = "client"
type = "hello"
members = [
    { name = "name", type = "string" },
    { name = "version", type = "int" },
    { name = "build", type = "string?", default = 'null' },
    { name = "voteCounts", type = "bool", default = 'false' },
    { name = "debug", type = "bool", default = 'false', omit = "default" },
    { name = "statPacks", type = "bool", default = 'false', omit = "default" },
    { name = "pings", type = "bool", default = 'false', omit = "default" },
