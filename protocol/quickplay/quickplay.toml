# Quick Play's rotation: the coordinator's list of mode files, not a mode file itself.
# A vote card is (course, mode). Official modes only (custom lobbies may host their own).
# Which modes, their weights and the card counts: the courses are each mode file's own `courses` word.

cards = 5                  # course cards a vote shows, plus Random
spicy_cards = 1            # exactly one spicy card a vote
random_spicy_chance = 0.15 # Random may land on a spicy option, biased toward normal [inf: to tune]
leaderboards = false       # Quick Play never has leaderboards
show_laps = true           # cards may show the lap count; never "normally N"

[normal]
mode = "competitive.fzmode"

[[spicy]]
mode = "knockout.fzmode"
weight = 1
