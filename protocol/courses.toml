# The courses' names as players know them, defined once: generate.py writes the C# table (generated/CourseTable.g.cs:
# Online.Protocol's CourseNames, which the launcher, the server's status page and the vote read) and the game's
# (generated/course_names.g.h: the runner writes a story stage's name into the game, port/core/src/boot.cpp, so the
# course intro's title card shows it where the game's own table has "---") from this file (README.md).
#
# A course ([[course]]), by the game's course number (1 to 36), as the game's own course name table names it in
# main.rel (English):
#   course    the game's course number
#   place     its venue, as players write it ("Mute City")
#   track     the course's own name ("Twist Road")
#
# The story ([story]): its stages are the game's course numbers `first` on, one a chapter, `chapters` of them, as the
# game numbers the chapters. A stage is told from a cup course by "Story" where a cup course has its venue. A chapter
# ([[story.chapter]]) may have a name of our own (the game names no story stage: its table says "---"); a chapter
# without one is "Chapter N".
#   chapter   the chapter, 1 to `chapters`
#   track     its name
#
# A name is what the game's own 24 by 24 font can write (its course names: letters, digits, the space, - ' . &) and at
# most `longest` characters, which the game window's place for it holds with the ending zero (the runner's
# COURSE_NAME, NAME_SIZE bytes).

longest = 31

[story]
first = 37
chapters = 9

