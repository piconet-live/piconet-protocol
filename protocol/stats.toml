# A stat pack's tables, written once: what a pack may hold of the car data (the ranges, by a block's word) and of the
# game's code constants (the constants, by slot). generate.py writes from this file the game's C++ tables
# (generated/stat_ranges.g.h, generated/const_ranges.g.h: the runner's port/core/src/stat_ranges.h and
# const_ranges.h include them), the launcher's and the server's C# lists (generated/StatTables.g.cs: StatPackRules.All,
# StatPackConstants.All) and the two tables of the handbook (handbook/stat-packs.md, "The ranges";
# handbook/stat-pack-constants.md, the list), each between its two marker lines. The tests that hold the programs to
# the handbook (StatPackRulesTests, StatPackConstantsTests; the core's TestTheStatRangesAreTheHandbooks and
# TestAStatPacksConstants) and tests/vectors/stat-cases.tsv read what is generated. A table is frozen into a game
# build: a change here is a new game build (handbook/stat-packs.md).
#
# [ranges] rule: one row a stat, by offset, covering the 44 words of a block after word 0 each once. `at`: the first
# word's offset in a block. `kind`: "number" (one word), "bytes" (the word at 0x48, the facts' CAR_BYTES_AT: two
# bytes, then two that are zero; `high` is the most the second byte may be, `low` 0) or "points" (four points of X,
# Y, Z: 12 words; `low` is -`high`). A number is at least `low` and at most `high` (less than `high` with `below`).
# `z_least`: points only, how far from 0 a machine's Z is at least. `tried`: the narrower range of what has been
# raced, 0 to this (a warning where a pack is made, never a refusal: C# only). Every value is a 32-bit float; a row's
# numbers are written as the C++ and the C# type them (an integer, or a decimal that is read as a float).
#
# [[constant]]: one a code constant, in slot order; a 64-bit one takes two slots (its high word, then its low word).
# `bits` 32 or 64; `stock` the game's own bits; a value is at least `low` and at most `high` (a double).
# `seat`: its place in a seat's constants record (0x100 bytes; the facts' SEAT_ rows, which the runner's
# const_ranges.h holds the generated places to). `game_place`: where the game's own word lies, where the handbook says
# it beside the seat's place. `what`: its plain name beside a pack's (the launcher). `read_by`: the handbook's
# column of its readers in main.rel's code (the runner's const_ranges.h names each in full). `unleashed`: GX
# Unleashed 5.0.4's value, where it is not the game's.

[codec.cxx]
ranges_namespace = "fzgx::stats"
constants_namespace = "fzgx::consts"

[codec.csharp]
namespace = "Online.Protocol"

[ranges]
rule = [
    { at = 0x04, name = "Weight", kind = "number", low = 1, high = 25000 },
    { at = 0x08, name = "Acceleration", kind = "number", low = -7, high = 7 },
    { at = 0x0C, name = "MaxSpeed", kind = "number", low = 0, high = 4 },
    { at = 0x10, name = "Grip1", kind = "number", low = -45, high = 45, tried = 9 },
    { at = 0x14, name = "Grip3", kind = "number", low = -3.5, high = 3.5, tried = 0.7 },
    { at = 0x18, name = "TurnTension", kind = "number", low = -2.2, high = 2.2, tried = 0.45 },
    { at = 0x1C, name = "DriftAcceleration", kind = "number", low = -19, high = 19, tried = 4 },
    { at = 0x20, name = "TurnMovement", kind = "number", low = -2000, high = 2000, tried = 400 },
    { at = 0x24, name = "StrafeTurn", kind = "number", low = -1000, high = 1000, tried = 200 },
    { at = 0x28, name = "Strafe", kind = "number", low = -500, high = 500, tried = 100 },
    { at = 0x2C, name = "TurnReaction", kind = "number", low = -300, high = 300, tried = 60 },
    { at = 0x30, name = "Grip2", kind = "number", low = -10, high = 10, tried = 2 },
    { at = 0x34, name = "BoostStrength", kind = "number", low = 0.1, high = 220 },
    { at = 0x38, name = "BoostDuration", kind = "number", low = 0, high = 4.26, below = true },
    { at = 0x3C, name = "TurnDeceleration", kind = "number", low = -0.7, high = 0.7 },
    { at = 0x40, name = "Drag", kind = "number", low = -0.15, high = 0.15 },
    { at = 0x44, name = "Body", kind = "number", low = -13, high = 13 },
    { at = 0x48, name = "Bytes48", kind = "bytes", low = 0, high = 3 },
    { at = 0x4C, name = "CameraReorienting", kind = "number", low = -19, high = 19 },
    { at = 0x50, name = "CameraRepositioning", kind = "number", low = -15, high = 15 },
    { at = 0x54, name = "Hover", kind = "points", low = -25, high = 25, z_least = 0.01 },
    { at = 0x84, name = "Wall", kind = "points", low = -25, high = 25 },
]

