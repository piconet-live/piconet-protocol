[[action]]
name = "seat.speed"
id = 0
args = ["seat", "real"]
where = "site L (main.rel 0x23854, after the air drag) in the next step's machine step, and the rescale at the mode point"
doc = """holds the seat's speed at v km/h for the step: a written seat.speed. v is held to 0 to 9000; a seat frozen, broken \
down, destroyed, finished, retired or restoring is not held"""

[[action]]
name = "eliminate"
id = 1
args = ["seat"]
where = "the mode point: flag 0x08000000 (retired) and flag 0x1 cleared; the game's own verdict books it out at the next step"
doc = "the seat is out of the race, by the game's own verdict"

# --- wave 2A, the race side: actions. Applied after the run, in the queue's order (language 6)

[[action]]
name = "retire"
id = 2
args = ["seat"]
where = "the mode point: flag 0x08000000 and flag 0x1 cleared in one write (never on a finished seat)"
doc = "as eliminate: the seat is retired, the game's verdict books it out at the next step"

[[action]]
name = "explode"
id = 3
args = ["seat"]
where = """the mode point, after the run (the image's mode_point): story action 16, fn_1_25004(M) with the momentum \
M+0x94..+0xA8, M+0x224 and M+0x17C written back, so the wreck slides on"""
doc = """the seat explodes; the verdict books it at the next step (a respawns seat restores instead). No KO credit, and none \
later for that wreck. A finished, restoring or already destroyed seat: nothing"""

[[action]]
name = "respawns"
id = 4
args = ["seat"]
where = "the mode point: machine flag 0x1 (the seat's own Restore), at once and every step after"
doc = "the game restores the seat instead of booking it out (a fall, a destroy, a breakdown; never time over)"

[[action]]
name = "respawns off"
id = 5
args = ["seat"]
where = """the mode point: flag 0x1 cleared at the first step its restore is not in the wreck phase (M+0x214 0 or 20 and \
less), never on a finished seat (its booking set the flag)"""
doc = "the seat's next wreck is final"

[[action]]
name = "hand_to_cpu"
id = 6
args = ["seat"]
where = "the stand-in routine: the seat drives on the CPU's inputs (its pad's records skipped, as the rejoin's AI rows are)"
doc = "the CPU drives the seat from the next step until pads_back"

[[action]]
name = "pads_back"
id = 7
where = "the stand-in routine: every seat drives on its pad again from the next step (a rejoin's AI rows still hold theirs)"
doc = "every seat handed to the CPU is given back"

[[action]]
name = "cpu_mode"
id = 8
args = ["seat", "int"]
where = """the mode point: story action 14 on a CPU seat's driver block CB = M+0x484: n 0, word 0 &= ~1 and CB+0x32 = 0 (the \
normal driver); 1 to 33, word 0 |= 1 and CB+0x32 = n. The story's difficulty byte .bss 0x9C+1 is pinned to 0 at the \
mode's first run. Modes 5 to 8 refused on courses 37, 38 and 41"""
doc = "a CPU seat drives one of the story's scripted drivers (mode-open-words 2.2); a player seat: nothing"

[[action]]
name = "seat.place"
id = 9
args = ["seat", "int"]
where = "the block: kept for the end clause, never written into the results before the race ends"
doc = "the seat's place in the results when the race ends, 1 first (0: the mode's order does not name it)"

[[action]]
name = "end_race"
id = 10
where = """the end clause, after every other queued action of the run: the mode's order into the standing and the results \
(R+0xE, R+0x2C, P+0x115, CM+0x23C, CM+0x21C, the record's place, time, skulls, max speed and points), held every step \
after; the block's end word 2 ends the race at this step's boundary (the image's raceend.py)"""
doc = "the race ends for everyone at this step"

[[action]]
name = "award"
id = 11
args = ["seat", "int"]
where = "the block: the seat's points (read as seat.points); the end clause writes them into the record's +0x4"
doc = "adds points to the seat"

[[action]]
name = "stop_all"
id = 12
where = "the mode point: rule 0x80 (fn_1_331EC 0x33354: every machine brakes), from the next step"
doc = "every machine brakes. Ends nothing: the compiler refuses a mode that has it without end_race or clock_limit"

[[action]]
name = "seat.energy"
id = 13
args = ["seat", "real"]
where = "the mode point: M+0x184, held to 0 .. 101% of the full energy M+0x5DA"
doc = "sets the seat's energy"

[[action]]
name = "boost"
id = 14
args = ["seat"]
where = "the stand-in routine, before the game's rule hook fn_1_331EC, the next step: flag 0x40 (the game's own request)"
doc = "asks for the game's own energy boost; refused by its own rules (lap 1, energy, brake, a running boost), for one step"

[[action]]
name = "push"
id = 15
args = ["seat", "vec"]
where = "site L (main.rel 0x23854) in the next machine step: the momentum M+0x94.. += v x W / 216"
doc = "an impulse of v km/h, a vector, added to the seat's motion in the next step; the game's forces act on it from then on"

[[action]]
name = "seat.velocity"
id = 16
args = ["seat", "vec"]
where = "site L (main.rel 0x23854) in the next machine step: the momentum M+0x94.. = v x W / 216"
doc = """sets the seat's motion to v km/h, a vector (direction and speed), for that one step's travel: the seat moves v / 216 \
m and reads v. It is not held: from the next step the game's forces act on it (2000 km/h on a 1000 km/h seat: 1780, 1631, \
1529, about 1400 after 8 steps). To keep it, run the word every step (each seat), or use `seat.speed`"""

[[action]]
name = "freeze"
id = 17
args = ["seat"]
where = "site L and the mode point's rescale: the seat's speed held at 0 every step until release (as seat.speed = 0)"
doc = "the seat stands still (it may still turn); a seat frozen, broken, destroyed, finished, retired or restoring is not held"

[[action]]
name = "release"
id = 18
args = ["seat"]
where = "the block"
doc = "a frozen seat drives again"

[[action]]
name = "ghost"
id = 19
args = ["seat"]
where = "the pair gate (main.rel 0x8514C): the seat's no-contact row is every seat"
doc = "nobody touches the seat (and it touches nobody), from the next step's contact pass"

[[action]]
name = "ghost off"
id = 20
args = ["seat"]
where = "the pair gate: the seat's row back to its team's no-contact bits (none, without team no contact)"
doc = "the seat is solid again; a pair still overlapping stays immune until apart (the game's own +0x514 hand-back)"

[[action]]
name = "no contact"
id = 21
args = ["seats", "seats"]
where = "the pair gate: every pair of a seat of the first set and a seat of the second passes through"
doc = "no contact a b: a seat on either side is taken as its set"

[[action]]
name = "team no contact"
id = 22
args = ["int"]
where = "the pair gate: every pair of seats of the team passes through (their rows keep each other's bits)"
doc = "team T no contact: teammates pass through each other and still bump their rivals"

[[action]]
name = "danger_zone"
id = 23
args = ["seat", "real", "real", "int"]
where = """the block (the engine page's danger zone, a seat's: below, arm, the count, its state), worked at every mode point: \
story chapter 6's speed bomb (unsafe-words-b 3.2)"""
doc = """danger_zone s, below, arm, seconds: armed once the seat has reached arm km/h; under below, a count of seconds (60 a \
second, plus 60) runs down, and at 60 the seat explodes (once). The count's display is the display words' (show s, \
DIGIT); its state is in the block"""

[[action]]
name = "danger_zone off"
id = 24
args = ["seat"]
where = "the block: the seat's danger zone cleared (a count under way stops)"
doc = "the seat carries no bomb"

# ---- The displays (vocabulary 5): presentation only. An action writes the seat's display record in the block (the
# runner's port/core/src/mode_hud.h), at the mode point like every action; the drawing reads it, every frame, from
# what the step left (a rollback redraws). Nothing a step reads is written, and nothing draws from a generator.
#
# A choice ([[choice]]): the names an argument of that kind takes, its value the name's place in `values` (from 0).
# An action's argument of a choice's name takes one of those names, never a number.

[[choice]]
name = "part"
values = ["TIMER", "DISTANCE", "DIGIT", "WARNING", "SUCCESS", "FAILED", "TIME_OVER", "SPEED_GAUGE", "OBJECTS"]
doc = """a part of the game's own race HUD: TIMER the timed mode's clock (clock_limit's time, R+0xA4: seconds, 0 to \
999); DISTANCE the metres to the finish (the seat's own); DIGIT the story's big digit (danger_zone's seconds, 3 2 1); \
WARNING, SUCCESS, FAILED, TIME_OVER, SPEED_GAUGE, OBJECTS the story's pictures"""

[[choice]]
name = "banner"
values = ["FINAL_LAP", "BOOST_POWER", "TIME_BONUS", "GAP", "WRONG_WAY"]
doc = "a banner of the game's own race HUD, shown once, as the game shows it"

[[choice]]
name = "look"
values = ["normal", "ghost", "invisible"]
doc = "how a machine is drawn: as the game draws it; as Time Attack draws its ghost (a blue hologram); not at all"

[[action]]
name = "show"
id = 25
args = ["seat", "part"]
where = "the display record; drawn by the mode's HUD pass (port/core/src/mode_hud.cpp) into the HUD part mask and its source"
doc = "the seat's player sees the part, from the next step on, until `hide`"

[[action]]
name = "hide"
id = 26
args = ["seat", "part"]
where = "the display record"
doc = "the part shown with `show` is no longer shown"

[[action]]
name = "show_number"
id = 27
args = ["seat", "int"]
where = "the display record; drawn by the Grand Prix spare-machine icon (its getter's call, main.rel 0xCA920)"
doc = "a whole number 0 to 99 beside the spare-machine icon, two digits (07); any other number hides it"

[[action]]
name = "stock_banner"
id = 28
args = ["seat", "banner"]
where = "the display record's banner for this step; raised for the local seat by the image after the mode point"
doc = "the seat's player sees the banner once, as the game raises it"

[[action]]
name = "seat.look"
id = 29
args = ["seat", "look"]
where = "the display record; drawn by the machine's draw (main.rel 0x84F9C)"
doc = "how everyone sees the seat's machine; its own driver too, unless seat.own_look says otherwise"

[[action]]
name = "seat.own_look"
id = 30
args = ["seat", "look"]
where = "the display record"
doc = "how the seat's own driver sees its machine (left unset: seat.look)"

[[action]]
name = "seat.colour"
id = 31
args = ["seat", "int"]
where = "the display record; the machine's body colour (the car object's +0x3BC, story action 11), every drawn frame"
doc = "the machine's body colour as 0xRRGGBBAA; 0 gives the machine its own back"

[[action]]
name = "map_hide"
id = 32
args = ["seat", "seats"]
join = "from"
where = "the display record; read by our own course map (port/core/src/minimap_frame.cpp), never the game's"
doc = "`map_hide s from <seats>`: s's dot is left off those seats' course maps (an empty set shows it to everyone)"

[[action]]
name = "map_mark"
id = 33
args = ["seat", "int"]
where = "the display record; read by our own course map"
doc = "the seat's dot in 0xRRGGBB on every course map; -1 gives it its machine's colour back"
