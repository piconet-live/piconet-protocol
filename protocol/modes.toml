# The game mode system's vocabulary and bytecode, defined once (D11 of the game modes' design, piconet-docs
# research/game-modes/): generate.py writes the C# tables the compiler reads (generated/ModeWords.g.cs: Online.Protocol's
# ModeWords, for net/src/Online.Protocol/Modes) and the game's C++ header (generated/mode_words.g.h: fzgx::modes, for
# the runner's interpreter, port/core/src/mode.cpp) from this file (README.md). The package's layout and the
# interpreter's rules are formats.md section 9; the language is the design's language.md.
#
# [api]: the vocabulary's number and its limits (language 11.1), the same on both sides. A build refuses a package
# whose api is newer than its own; a new build adds words and never changes an existing one's meaning.
#
# An operation ([[op]]): `name` (PascalCase, the C# enum's and the C++ constant's name), `code` its byte, `operands`
# the bytes after it, in order (u8, u16, u32, i32: big-endian), `doc` what it does. The stack holds 32-bit cells: an
# int, a real's binary32 bits, a bool (0 or 1), a seat (0 to 29, or -1 none), a set of seats (bit i: seat i); a vec is
# three cells, x then y then z (a read of type vec pushes all three). A binary operation pops b, then a, and pushes
# a op b. Every operation costs one operation of the step's budget, but SortRun: 1 + 5 x entries x keys, and FSqrt:
# [api] fsqrt_cost (the owner, 2026-10-30: the game's square root is the dear one; `sqrt`, and `dist`, which calls it).
#
# A word: `name` as a mode file writes it, `id` its number in the bytecode (Action, SeatRead, RaceRead) or the package
# (setup words, events), `type` what a read gives (int, real, bool, seat, seats, vec), `args` an action's or setup word's
# arguments in order, `doc`, and `where`: the game's site or the part that applies it (vocabulary.md's). A setup word
# with `table` takes a table of pairs after its arguments (the package: two more arguments a pair, `table`'s value
# first): "course", a course's number (courses.toml). A setup word with `lobby = true` is the coordinator's alone and
# is not in the package's SETP (formats.md section 9): what it sets reaches the game as the match start's own fields,
# so a game needs to know nothing of it; the compiler reads it from the file (ModePackage.LobbyWords, ModeTerms).
# `form`: how the file writes it: "range" (`racers 2..8`: its two arguments, least and most), "text" (`stats "GX+"`),
# "list" (`machines ["Blue Falcon", ...]`); none: its arguments.

[codec.csharp]
namespace = "Online.Protocol"

[codec.cxx]
namespace = "fzgx::modes"

[api]
number = 1
budget = 65536         # operations a step at worst: the compiler's static count, and the interpreter's backstop (a nested loop over 30 x 30 seats fits)
queue = 256            # queued actions a step (a full queue is a fault): eight a seat for thirty seats
globals = 256          # global words
seat_words = 64        # words per seat
locals = 64            # a rule's locals, its event's binding included
rules = 256
subs = 128             # subs a file declares (the library's not counted)
sorts = 2              # sort buffers: a `for each ... by` inside another
team_words = 32        # words per team
teams = 30             # teams in a race at most (a team's number 0 to 29)
waits = 64             # rule instances waiting at once (the compiler counts the most a mode can have)
wait_locals = 8        # locals a waiting rule keeps, its event's binding included
fsqrt_cost = 8         # what one FSqrt takes of the budget (the compiler's count and the interpreter's, in both its loops)
board = 8              # `board` lines a scope (global, seat, team): what the status board holds (board.toml)
board_label = 32       # a `board` line's label, in UTF-8 bytes
board_words = 16       # the words a `board` line may name
board_word = 16        # one of those words, in UTF-8 bytes
package_bytes = 65536  # a package's whole size, the source included
seats = 30

[[op]]
name = "End"
code = 0x00
doc = "the end of a rule's body"

[[op]]
name = "Ret"
code = 0x01
doc = "the end of a condition: pops its value (0 false)"

[[op]]
name = "Push"
code = 0x02
operands = ["i32"]
doc = "pushes the operand"

[[op]]
name = "Pop"
code = 0x03
doc = "drops the top"

[[op]]
name = "Dup"
code = 0x04
doc = "pushes the top again"

[[op]]
name = "LoadLocal"
code = 0x05
operands = ["u8"]
doc = "pushes a local"

[[op]]
name = "StoreLocal"
code = 0x06
operands = ["u8"]
doc = "pops into a local"

[[op]]
name = "LoadGlobal"
code = 0x07
operands = ["u16"]
doc = "pushes a global"

[[op]]
name = "StoreGlobal"
code = 0x08
operands = ["u16"]
doc = "pops into a global"

[[op]]
name = "LoadSeatVar"
code = 0x09
operands = ["u16"]
doc = "pops a seat, pushes its word (none: 0)"

[[op]]
name = "StoreSeatVar"
code = 0x0A
operands = ["u16"]
doc = "pops a value, then a seat, and stores the value in the seat's word (none: nothing)"

[[op]]
name = "Param"
code = 0x0B
operands = ["u8"]
doc = "pushes a parameter's value, as the match start gave it"

[[op]]
name = "SeatRead"
code = 0x0C
operands = ["u8"]
doc = "pops a seat, pushes a read of the game ([[seat_read]]; none: 0)"

[[op]]
name = "RaceRead"
code = 0x0D
operands = ["u8"]
doc = "pushes a read of the race ([[race_read]])"

[[op]]
name = "LoadTeamVar"
code = 0x0E
operands = ["u16"]
doc = "pops a seat, pushes its team's word (none: 0)"

[[op]]
name = "StoreTeamVar"
code = 0x0F
operands = ["u16"]
doc = "pops a value, then a seat, and stores the value in the seat's team's word (none: nothing)"

[[op]]
name = "IAdd"
code = 0x10
doc = "whole numbers wrap"

[[op]]
name = "ISub"
code = 0x11

[[op]]
name = "IMul"
code = 0x12

[[op]]
name = "IDiv"
code = 0x13
doc = "truncates toward zero; by 0: 0; the least number by -1: itself"

[[op]]
name = "IMod"
code = 0x14
doc = "the sign of a; by 0: 0"

[[op]]
name = "INeg"
code = 0x15

[[op]]
name = "FAdd"
code = 0x18
doc = "binary32, correctly rounded, to nearest even; a NaN result is 0x7FC00000"

[[op]]
name = "FSub"
code = 0x19

[[op]]
name = "FMul"
code = 0x1A

[[op]]
name = "FDiv"
code = 0x1B

[[op]]
name = "FNeg"
code = 0x1C
doc = "the sign bit flipped"

[[op]]
name = "FSqrt"
code = 0x1D
doc = """the game's square root (main.dol 0x8006D0B4: x times two Newton steps from the estimate frsqrte, in the \
processor's single-precision operations): a NaN 0x7FC00000, infinity itself; zero, a negative number or a denormal 0"""

[[op]]
name = "IToF"
code = 0x20
doc = "an int as the nearest binary32 (ties to even)"

[[op]]
name = "Floor"
code = 0x21
doc = "a real to an int, saturating at the int's ends; NaN: 0"

[[op]]
name = "Ceil"
code = 0x22

[[op]]
name = "Round"
code = 0x23
doc = "a half away from zero"

[[op]]
name = "Trunc"
code = 0x24

[[op]]
name = "IMin"
code = 0x28

[[op]]
name = "IMax"
code = 0x29

[[op]]
name = "IAbs"
code = 0x2A
doc = "the least number: itself"

[[op]]
name = "FMin"
code = 0x2B
doc = "b when b < a, else a (a NaN b: a)"

[[op]]
name = "FMax"
code = 0x2C
doc = "b when b > a, else a"

[[op]]
name = "FAbs"
code = 0x2D
doc = "the sign bit cleared"

[[op]]
name = "IEq"
code = 0x30

[[op]]
name = "INe"
code = 0x31

[[op]]
name = "ILt"
code = 0x32

[[op]]
name = "ILe"
code = 0x33

[[op]]
name = "IGt"
code = 0x34

[[op]]
name = "IGe"
code = 0x35

[[op]]
name = "FEq"
code = 0x38
doc = "false when either is a NaN (FNe: true)"

[[op]]
name = "FNe"
code = 0x39

[[op]]
name = "FLt"
code = 0x3A

[[op]]
name = "FLe"
code = 0x3B

[[op]]
name = "FGt"
code = 0x3C

[[op]]
name = "FGe"
code = 0x3D

[[op]]
name = "Not"
code = 0x40
doc = "1 for 0, else 0"

[[op]]
name = "Jump"
code = 0x41
operands = ["u32"]
doc = "to the operand: an offset in the package's code"

[[op]]
name = "JumpIfZero"
code = 0x42
operands = ["u32"]
doc = "pops; jumps when it is 0"

[[op]]
name = "JumpIfNotZero"
code = 0x43
operands = ["u32"]
doc = "pops; jumps when it is not 0"

[[op]]
name = "Wait"
code = 0x45
operands = ["u8", "u8", "u32"]
doc = """live locals, kind (0 plain, 1 abort, 2 restart), condition (an offset in the code, 0xFFFFFFFF none): pops the \
steps; more than 0, the rule instance waits that many steps in a wait record of the block, keeping its first `live` \
locals, and the run of its code ends here; 0 or fewer, nothing"""

[[op]]
name = "SortBegin"
code = 0x48
operands = ["u8"]
doc = "empties a sort buffer"

[[op]]
name = "SortAdd"
code = 0x49
operands = ["u8", "u8"]
doc = "buffer, keys: pops a seat, then its keys (the last key first), and adds the entry"

[[op]]
name = "SortRun"
code = 0x4A
operands = ["u8", "u8", "u8", "u8"]
doc = """buffer, keys, the descending keys' mask, the real keys' mask (bit k: key k): sorts the entries by the keys \
(ints and bools as signed numbers, reals as FLt says, a NaN last), ties to the next key and finally to the seat, \
and starts the buffer's walk"""

[[op]]
name = "SortNext"
code = 0x4B
operands = ["u8"]
doc = "pushes the walk's next seat, or -1 when it is done"

[[op]]
name = "Action"
code = 0x50
operands = ["u8"]
doc = "pops the action's arguments (the last first) and queues it ([[action]])"

[[op]]
name = "SeatBit"
code = 0x58
doc = "pops a seat, pushes its set: the bit 1 << seat (none, or a seat not in the race: 0)"

[[op]]
name = "AllSeats"
code = 0x59
doc = "pushes the race's seats as a set (bit i: seat i)"

[[op]]
name = "BitAnd"
code = 0x5A
doc = "a & b: sets' intersection"

[[op]]
name = "BitOr"
code = 0x5B
doc = "a | b: sets' union"

[[op]]
name = "BitAndNot"
code = 0x5C
doc = "a & ~b: sets' difference"

[[op]]
name = "Random"
code = 0x60
doc = """pops n; n more than 0: draws the mode's generator (xoshiro128**, formats.md section 9) and pushes \
(draw x n) >> 32 in 64 bits, 0 to n - 1; else pushes 0 and draws nothing"""

[[op]]
name = "RandomReal"
code = 0x61
doc = "draws the mode's generator and pushes (draw >> 8) x 2^-24, a real 0 to below 1"

[[event]]
name = "every step"
id = 0
kind = "continuous"
doc = "every step"

[[event]]
name = "each seat"
id = 1
kind = "continuous"
binds = "seat"
doc = "every step, for each seat of the race in seat order"

[[event]]
name = "out"
id = 2
kind = "discrete"
binds = "seat int"
doc = """the game's out verdict became true for the seat this step (the image's outtest.py); its second name, the \
cause (an int, what the machine's state says at that step; the first that holds: 5 time over; 2 exploded (the event \
`destroyed` below: contact, a strip, a death surface, the skip limit, `explode`); 3 fell (flag 0x800 with no explosion: \
lost course, out of bounds, under the fall planes); 1 energy (broken down, flag 0x80, at rest; a CPU at rest too: it \
comes to rest broken down); 4 retired (`retire`, `eliminate`); 0 none of these)"""

# --- wave 2A, the race side: events (each found at the mode point by comparing a seat's state with the last step's,
# kept in the block's engine page; language 6 gives their order in a step)

[[event]]
name = "race_start"
id = 3
kind = "discrete"
doc = "the first step after the start gate (the countdown begins): the mode's first run"

[[event]]
name = "go"
id = 4
kind = "discrete"
doc = "the game's GO: race.started became true this step"

[[event]]
name = "lap"
id = 5
kind = "discrete"
binds = "seat"
doc = "the seat's laps completed (P+0x118) rose this step"

[[event]]
name = "checkpoint"
id = 6
kind = "discrete"
binds = "seat"
doc = "the seat's checkpoint (P+0x140) changed this step"

[[event]]
name = "finish"
id = 7
kind = "discrete"
binds = "seat"
doc = "machine flag 0x10000 (finished) rose this step"

[[event]]
name = "fall"
id = 8
kind = "discrete"
binds = "seat"
doc = """machine flag 0x800 (out of the course) rose with no explosion (`destroyed`): lost course, out of bounds, or a \
machine that reached the fall planes (fn_1_24A4C: y < -5000 or 900 under the course's floor) with no flag before"""

[[event]]
name = "destroyed"
id = 9
kind = "discrete"
binds = "seat"
doc = """the machine exploded: +0x58C 0x10, the game's record of its destroy routine (fn_1_25004 and its copies in fn_1_2A694, \
fn_1_2A8D0: contact, a strip, a death surface, the skip limit, `explode`), rose; once for each life. Not when the \
routine ran under the fall planes (that only ends a fall). May come after the seat's `out`: a wreck at rest explodes when \
another machine touches it. Flag 0x40000000 is not read: it lasts until that machine's next step start, so `explode` \
never shows it"""

[[event]]
name = "ko"
id = 10
kind = "discrete"
binds = "seat seat"
doc = """ko(v, by): the game's own record. The victim v's contact KO began this step (flag 0x80 rose with M+0x593 = 60, \
fn_1_24F10); by is the one seat whose skull count M+0x482 rose this step, or none when no skull or more than one \
rose (two KOs in one step: none for both; a wall, a strip or a mine gives no skull). No new site (owner 2026-10-29)"""

[[event]]
name = "hit"
id = 11
kind = "discrete"
binds = "seat seat"
doc = """hit(a, b), a below b: the pair's contact answer began this step (fn_1_239C4 returned 1 at the pair call \
0x8514C, recorded in the block's touching rows, and did not the step before)"""

[[event]]
name = "damaged"
id = 12
kind = "discrete"
binds = "seat"
doc = "the seat's energy M+0x184 fell this step while it was not boosting (flag 0x20) [inf: a boost's own cost is not damage]"

[[event]]
name = "boost"
id = 13
kind = "discrete"
binds = "seat"
doc = "flag 0x20 (boost active: an energy boost or a dash plate) rose this step"

[[event]]
name = "wall"
id = 14
kind = "discrete"
binds = "seat"
doc = """the seat began touching a wall this step: (flags & 0x00800000) and (M+0x58C & 0x8) and not (M+0x58C & 0x10), \
the race map's test, true now and not the step before"""

[[event]]
name = "pit"
id = 15
kind = "discrete"
binds = "seat"
doc = "the seat came onto a pit strip this step (M+0x218 & 0x08000000 rose)"

[[event]]
name = "overtake"
id = 16
kind = "discrete"
binds = "seat seat"
doc = """overtake(a, b): a, racing, is ahead of b, racing, in the standing (R+0xE) this step and was behind it the step \
before; by a, then b"""

[[event]]
name = "respawned"
id = 17
kind = "discrete"
binds = "seat"
doc = "the seat's restore came to its exit (M+0x214 went from above 20 to 20 or less): it drives again"

[[event]]
name = "land"
id = 18
kind = "discrete"
binds = "seat"
doc = "machine flag 0x2 (airborne) fell this step"

[[event]]
name = "boost_end"
id = 19
kind = "discrete"
binds = "seat"
doc = "flag 0x20 (boost active) fell this step"

[[event]]
name = "wrong_way"
id = 20
kind = "discrete"
binds = "seat"
doc = "the seat began going the wrong way (P+0x10C became not 0)"

[[setup]]
name = "laps"
id = 0
args = [{ type = "int", least = 0, most = 99 }]
where = "the coordinator, at match forming: the match start's laps (0, `unlimited`: the game's free run)"

[[setup]]
name = "cpus allowed"
id = 1
where = "the coordinator: players may vote CPUs into the mode's race; left out, they may not"

[[setup]]
name = "pedals locked"
id = 2
args = [{ type = "real", name = "accel", least = 0.0, most = 1.0, default = 1.0 },
        { type = "real", name = "brake", least = 0.0, most = 1.0, default = 0.0 }]
where = "the stand-in routine, before the game's rule hook fn_1_331EC: every seat's accelerator M+0x200 and brake M+0x204, flag 0x2000 cleared"

[[setup]]
name = "boost off"
id = 3
where = "the stand-in routine, after the game's rule hook fn_1_331EC: every seat's boost request (flag 0x40) cleared"

[[setup]]
name = "laps by course"
id = 4
args = [{ type = "int", name = "else", least = 0, most = 99, default = 3 }]
table = "course"
where = "the coordinator and the game: the race's laps on its course (0, `unlimited`: the game's free run)"
doc = """`laps by course { "Venue: Track": n; ...; else: n; }`: a table after the arguments, a pair a course (the \
game's course number, courses.toml, then its laps, as `else`'s range); a course the table leaves out takes `else`. \
Never with `laps`"""

# --- wave 2A, the race side: setup words. A mode's word wins over the lobby's rule (files_match.cpp)

[[setup]]
name = "finish_limit"
id = 5
args = [{ type = "int", least = 0, most = 600 }]
where = """the race block's RACE_FINISH_LIMIT in steps (seconds x 60; the image's raceend.py): so many seconds after the first \
finish the race stops waiting for the machines still racing (0: no such end). The results then begin when the last player \
seat that finished by then has had its 480 steps of FINISH! (at once if none has), so at most limit + 8 s after the first \
finish; a machine that crosses the line during that wait still finishes. In a mode left out, 0: the mode owns its ending \
(the lobby's rule does not reach it)"""

[[setup]]
name = "mine_regen"
id = 6
args = [{ type = "int", least = 50, most = 5000 }]
where = "the race block's RACE_MINE_REGEN: a mine comes back so many milliseconds after it went off (in steps, rounded down)"

[[setup]]
name = "mine_regen off"
id = 7
where = "the race block's RACE_MINE_REGEN 0: a mine stays gone, the game's own way"

[[setup]]
name = "cpu_level"
id = 8
args = [{ type = "int", least = 0, most = 3 }]
where = "the race block's RACE_CPULEVEL: 0 Novice, 1 Standard, 2 Expert, 3 Master"

[[setup]]
name = "restore on"
id = 9
where = """every seat respawns (machine flag 0x1, the mode's respawns on each seat at its first run), never the lobby's rule \
0x8000, so `respawns s off` may take one seat out of it. Left out in a mode, no seat respawns unless a rule says `respawns s`: the lobby's restore rule never reaches a mode's race"""

[[setup]]
name = "restore off"
id = 10
where = "no seat respawns unless a rule says `respawns s`, as when left out"

[[setup]]
name = "contact off"
id = 11
where = "every pair of seats passes through each other (the pair gate at main.rel 0x8514C reads the block's no-contact rows)"

[[setup]]
name = "clock_limit"
id = 12
args = [{ type = "int", least = 60, most = 65535 }]
where = """the game's timed-mode timer, held from the step: rule 0x40000, R+0xA4 written at every mode point from the race \
clock (never 0), the once-a-frame decrement skipped (main.rel 0x3A36C -> 0x3A448); at the limit the race ends (the end \
clause). A time (5min) or steps, at most 65,535 (18 min 12 s)"""

[[setup]]
name = "rolling_start"
id = 13
args = [{ type = "real", least = 0.0, most = 9000.0, default = 1000.0 }]
where = """the first step after the gate: every seat's speed written as fn_1_23500 computes it (momentum along the nose, \
M+0x224, flag 0x400, M+0x481 90, no start charge M+0xDC) and the frozen flag 0x8000 cleared; through the countdown the \
CPU steers every seat (the stand-in's AI path) with the accelerator held at 0.6, no brake, no boost and no attacks; \
every pad drives from GO. A seat the rejoin's autopilot drives stays its"""

# --- the lobby-rule overhaul: every rule of rules.toml that shapes a race is a word; a mode's word wins. The coordinator's

[[setup]]
name = "course"
id = 14
lobby = true
form = "text"
where = "the coordinator, at match forming: the course, no vote (a course of the pool, \"Venue: Track\"). Not in Quick Play's rotation, whose cards name the courses"

[[setup]]
name = "racers"
id = 15
lobby = true
form = "range"
args = [{ type = "int", name = "least", least = 1, most = 30 }, { type = "int", name = "most", least = 1, most = 30 }]
where = "the coordinator: the lobby's seats are `most`; below `least` racers the race is refused. Not in Quick Play's rotation"

[[setup]]
name = "machines all"
id = 16
lobby = true
where = "the coordinator: every machine may be chosen"

[[setup]]
name = "machines"
id = 17
lobby = true
form = "list"
where = "the coordinator: the machines racers may choose, by name"

[[setup]]
name = "machine_setting"
id = 18
lobby = true
form = "range"
args = [{ type = "int", name = "least", least = 0, most = 100 }, { type = "int", name = "most", least = 0, most = 100 }]
where = "the coordinator: the range each racer's own setting is brought into"

[[setup]]
name = "stats"
id = 19
lobby = true
form = "text"
where = "the coordinator: the race's stat pack, one of the server's by name, enforced (the host's row leaves the panel); a server without it refuses the mode. Left out: the lobby's rule stands"

[[setup]]
name = "stats stock"
id = 20
lobby = true
where = "the coordinator: no stat pack, enforced: the disc's own stats"

[[setup]]
name = "mixed_packs on"
id = 21
lobby = true
where = "the coordinator: each racer may race a pack of their own"

[[setup]]
name = "mixed_packs off"
id = 22
lobby = true
where = "the coordinator: one pack for all"

[[setup]]
name = "boost_start on"
id = 23
lobby = true
where = "the coordinator: the match start's rules (RACE_BOOST): boosting on the first lap"

[[setup]]
name = "boost_start off"
id = 24
lobby = true
where = "the coordinator: the match start's rules (RACE_BOOST 0): no boosting on the first lap"

[[setup]]
name = "teams"
id = 25
lobby = true
form = "range"
args = [{ type = "int", name = "least", least = 2, most = 30 }, { type = "int", name = "most", least = 2, most = 30 }]
where = "the coordinator: the teams a race of this mode has, set by the host and the racers and carried in setup.mode.teams; fewer than `least` holding racers and the race is refused"

# --- a solo mode (Practice; time trials later): the words of a race raced alone, no relay. The compiler refuses them
# without `solo`, and `solo` with CPUs, racers or teams; the coordinator and the game refuse a `solo` mode in a lobby.

[[setup]]
name = "solo"
id = 26
where = """the launcher starts it itself as a practice (the launch file's `practice`: one seat, seat 0, no relay, every step's \
row the local pad's, port/core/src/practice_session.cpp). No lobby and no rotation races it; the game refuses it with a relay"""

[[setup]]
name = "rewind"
id = 27
args = [{ type = "int", least = 60, most = 3600 }]
where = """the rolling buffer the player can go back through, a time or steps, at most a minute: every step inside it stays \
in the undo log, the mode's block with the rest. Left out in a solo mode, no way back"""

[[setup]]
name = "pause"
id = 28
where = """Start stands the picture at the moment it shows; the stick and the replay's bar then move it inside `rewind`'s reach, \
and Start again goes on from it (from an earlier moment: what came after is dropped). Left out, Start does nothing"""

[[setup]]
