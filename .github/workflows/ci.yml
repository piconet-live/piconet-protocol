name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: net/global.json
      - name: Protocol check
        run: protocol/check.sh
      - name: .NET tests
        working-directory: net
        run: dotnet test --project tests/Protocol.Tests
